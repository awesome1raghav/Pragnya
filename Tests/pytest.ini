[pytest]
# Run from the repository root:  .\.venv\Scripts\python.exe -m pytest Tests
# Integration tests need the Compose PostgreSQL running; they create and drop their own
# throwaway databases (nextron_test_*) and never touch the development database's data.
pythonpath = ..
testpaths = .
addopts = -ra --import-mode=importlib
markers =
    postgres: needs a reachable PostgreSQL server
