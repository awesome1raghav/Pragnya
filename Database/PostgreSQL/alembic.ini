# The single Alembic history for NEXTRON's PostgreSQL schema.
# Run from the repository root:
#   .\.venv\Scripts\python.exe -m alembic -c Database/PostgreSQL/alembic.ini upgrade head
#
# The database URL is not stored here. Migrations/env.py reads DATABASE_URL from
# Backend settings (environment or Backend/.env), unless a caller sets sqlalchemy.url.

[alembic]
script_location = %(here)s/Migrations
prepend_sys_path = %(here)s/../..
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
